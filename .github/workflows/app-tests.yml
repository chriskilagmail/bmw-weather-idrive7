name: App tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run runtime tests
        run: node kit/tools/test_runtime.js

      - name: Validate Weather manifest
        run: node kit/tools/test_weather.js